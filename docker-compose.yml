---
volumes:
  postgres-data:
    driver: "local"
services:
  postgres:
    image: postgres:17.5-bullseye@sha256:724a6dfcc90fb6b2eb7caa062c7c852fe60fc30727896a044f4d478f423f183f
    # postgres ユーザー (UID 999)
    user: "999"
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      retries: 20
    # setuid/setgid による権限昇格を防ぐ
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: password
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/docker-entrypoint-initdb.d
        target: /docker-entrypoint-initdb.d
    ports:
      - 5432:5432
  hato-bot:
    build:
      dockerfile: ./Dockerfile
      context: .
      cache_from:
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/hato-bot:${TAG_NAME}
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/hato-bot
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/commit-hash:${TAG_NAME}
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/commit-hash
      args:
        BUILDKIT_INLINE_CACHE: 1
      x-bake:
        platforms:
          - linux/amd64
    image: ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/hato-bot:${TAG_NAME}
    env_file:
      - .env
    restart: always
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
