---
services:
  commit-hash:
    build:
      dockerfile: ./Dockerfile
      context: .
      target: commit-hash
      cache_from:
        - type=registry,ref=ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/commit-hash:buildcache
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/commit-hash
      cache_to:
        - type=registry,ref=ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/commit-hash:buildcache,mode=max
      args:
        BUILDKIT_INLINE_CACHE: 1
      x-bake:
        platforms:
          - linux/amd64
    image: ghcr.io/${REPOSITORY:-dev-hato/hato-bot}/commit-hash:${TAG_NAME}
