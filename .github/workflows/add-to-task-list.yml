name: Add to Task List
on:
  pull_request:
    types:
      - opened
      - reopened
  issues:
    types:
      - opened
permissions: {}
jobs:
  add-to-task-list:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.repository == github.event.pull_request.head.repo.full_name
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PROJECT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }}
      - uses: dev-hato/actions-add-to-projects@92fcc876479a4e7bc33cc182484360f1ba188159 # v1.0.10
        with:
          github-token: ${{steps.generate_token.outputs.token}}
          project-url: https://github.com/orgs/dev-hato/projects/1
