---
# デフォルトセットアップはmerge_groupで実行されないため、Advanced Setupで実行する
# 必須チェック名 (Analyze (python) / Analyze (javascript-typescript)) をデフォルトセットアップと揃えている
name: codeql
on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  merge_group:
  schedule:
    - cron: "33 11 * * 3"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    timeout-minutes: 30
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
          # merge_groupの一時ブランチはマージ後すぐに削除され、アップロード時に "ref not found" で失敗するため、結果をアップロードしない
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
