[project]
name = "hato-bot"
version = "3.0.5"
description = "愛嬌のあるBot"
requires-python = "==3.13.8"
dependencies = [
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "Pillow>=7.1.2",
    "opencv-python==4.12.0.88",
    "slack-bolt==1.26.0",
    "slack-sdk==3.37.0",
    "gitpython==3.1.45",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "openai==2.2.0",
    "discord.py==2.6.4",
    "misskey.py==4.1.0",
    "websockets==15.0.1",
    "flask==3.1.2",
    "markupsafe==3.0.3",
    "numpy==2.2.6",
    "emoji==2.15.0",
    "puremagic==1.30",
    "audioop-lts==0.2.2",
    "psycopg[binary,pool]==3.2.10",
    "sudden-death==0.0.1",
]

[dependency-groups]
dev = [
  "autopep8==2.3.2",
  "requests-mock==1.12.1",
  "pylint==3.3.9",
  "sqlfluff==3.4.2",
  "mypy==1.18.2",
  "flake8==7.3.0",
  "isort==6.1.0",
  "pre-commit==4.3.0",
  "importlib-metadata==8.7.0",
  "tomlkit==0.13.3",
]

[tool.uv]
required-version = "0.9.0"
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources.sudden-death]
git = "https://github.com/dev-hato/sudden-death"
branch = "master"
