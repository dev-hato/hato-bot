[project]
name = "hato-bot"
version = "3.0.5"
description = "愛嬌のあるBot"
requires-python = "==3.14.4"
dependencies = [
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "Pillow>=7.1.2",
    "opencv-python==5.0.0.93",
    "slack-bolt==1.30.0",
    "slack-sdk==3.43.0",
    "gitpython==3.1.55",
    "pandas==2.3.3",
    "matplotlib==3.11.1",
    "openai==2.46.0",
    "discord.py==2.7.1",
    "misskey.py==4.1.0",
    "websockets==16.1",
    "flask==3.1.3",
    "markupsafe==3.0.3",
    "numpy==2.2.6",
    "emoji==2.15.0",
    "puremagic==2.2.0",
    "audioop-lts==0.2.2",
    "psycopg[binary,pool]==3.3.4",
    "sudden-death==0.0.1",
]

[dependency-groups]
dev = [
  "autopep8==2.3.2",
  "requests-mock==1.12.1",
  "pylint==4.0.6",
  "sqlfluff==4.2.2",
  "mypy==2.1.0",
  "flake8==7.3.0",
  "isort==8.0.1",
  "pre-commit==4.6.0",
  "importlib-metadata==9.0.0",
  "tomlkit==0.15.1",
]

[tool.uv]
required-version = "0.11.8"
[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.uv.sources.sudden-death]
git = "https://github.com/dev-hato/sudden-death"
branch = "master"
