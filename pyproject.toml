[project]
name = "hato-bot"
version = "3.0.5"
description = "愛嬌のあるBot"
requires-python = "==3.14.3"
dependencies = [
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    "Pillow>=7.1.2",
    "opencv-python==4.13.0.92",
    "slack-bolt==1.27.0",
    "slack-sdk==3.41.0",
    "gitpython==3.1.46",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "openai==2.28.0",
    "discord.py==2.7.1",
    "misskey.py==4.1.0",
    "websockets==16.0",
    "flask==3.1.3",
    "markupsafe==3.0.3",
    "numpy==2.2.6",
    "emoji==2.15.0",
    "puremagic==2.1.0",
    "audioop-lts==0.2.2",
    "psycopg[binary,pool]==3.3.3",
    "sudden-death==0.0.1",
]

[dependency-groups]
dev = [
  "autopep8==2.3.2",
  "requests-mock==1.12.1",
  "pylint==4.0.5",
  "sqlfluff==4.0.4",
  "mypy==1.19.1",
  "flake8==7.3.0",
  "isort==8.0.1",
  "pre-commit==4.5.1",
  "importlib-metadata==8.7.1",
  "tomlkit==0.14.0",
]

[tool.uv]
required-version = "0.10.9"
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources.sudden-death]
git = "https://github.com/dev-hato/sudden-death"
branch = "master"
